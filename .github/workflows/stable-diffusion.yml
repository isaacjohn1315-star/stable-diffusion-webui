
name: Stable Diffusion WebUI with ngrok

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-diffusion-webui
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-venv python3-pip \
            curl wget libgl1 libglib2.0-0

      - name: Clone AUTOMATIC1111
        run: |
          git clone --depth 1 \
            https://github.com/AUTOMATIC1111/stable-diffusion-webui.git \
            stable-diffusion-webui

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Configure ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          test -n "$NGROK_AUTHTOKEN" || {
            echo "Missing NGROK_AUTHTOKEN secret"
            exit 1
          }
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

      - name: Configure Python packaging
        working-directory: stable-diffusion-webui
        run: |
          cat > pip-constraints.txt <<'EOF'
          setuptools==69.5.1
          wheel<0.45
          EOF

          echo "PIP_CONSTRAINT=$GITHUB_WORKSPACE/stable-diffusion-webui/pip-constraints.txt" \
            >> "$GITHUB_ENV"

      - name: Configure CPU-only WebUI
        working-directory: stable-diffusion-webui
        run: |
          cat > webui-user.sh <<'EOF'
          #!/usr/bin/env bash
          export TORCH_COMMAND="pip install torch==2.1.2 torchvision==0.16.2"
          export COMMANDLINE_ARGS="--listen --port 7860 --use-cpu all --precision full --no-half --skip-torch-cuda-test --no-download-sd-model"
          export NO_TCMALLOC=1
          EOF
          chmod +x webui-user.sh

      - name: Start Stable Diffusion WebUI
        working-directory: stable-diffusion-webui
        run: |
          nohup ./webui.sh > "$GITHUB_WORKSPACE/webui.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/webui.pid"

      - name: Wait for WebUI
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:7860/ >/dev/null 2>&1; then
              echo "WebUI is ready"
              exit 0
            fi

            if ! kill -0 "$(cat webui.pid)" 2>/dev/null; then
              echo "WebUI exited during startup"
              tail -n 150 webui.log
              exit 1
            fi
            sleep 10
          done

          echo "WebUI startup timed out"
          tail -n 150 webui.log
          exit 1

      - name: Start ngrok tunnel
        run: |
          nohup ngrok http 7860 --log stdout > ngrok.log 2>&1 &

          for i in $(seq 1 30); do
            URL=$(curl -fsS http://127.0.0.1:4040/api/tunnels \
              | python3 -c \
              'import json,sys; d=json.load(sys.stdin); print(next((t["public_url"] for t in d["tunnels"] if t["public_url"].startswith("https://")), ""))' \
              2>/dev/null || true)

            if [ -n "$URL" ]; then
              echo "Stable Diffusion URL: $URL"
              break
            fi
            sleep 2
          done

          if [ -z "${URL:-}" ]; then
            cat ngrok.log
            exit 1
          fi

      - name: Keep session alive
        run: |
          while true; do
            if ! kill -0 "$(cat webui.pid)" 2>/dev/null; then
              echo "WebUI stopped"
              tail -n 150 webui.log
              exit 1
            fi
            sleep 30
          done

      - name: Print logs on failure
        if: failure()
        run: |
          if [ -f webui.log ]; then
            tail -n 200 webui.log
          fi
          if [ -f ngrok.log ]; then
            tail -n 100 ngrok.log
          fi
